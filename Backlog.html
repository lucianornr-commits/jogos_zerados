
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Backlog | Frankenstein Gamer</title>

  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<div class="app">

  <!-- ===== BARRA LATERAL ===== -->
  <aside class="sidebar">

    <div class="brand">
      <i data-lucide="gamepad-2" class="brand-icon"></i>
      <span>MENU</span>
    </div>

    <nav class="navigation" aria-label="Menu principal">

      <a class="nav-item" href="index.html">
        <i data-lucide="trophy"></i>
        <span>Zerados</span>
      </a>

      <a class="nav-item active" href="backlog.html">
        <i data-lucide="clock-3"></i>
        <span>Backlog</span>
      </a>

      <button class="nav-item" type="button">
        <i data-lucide="target"></i>
        <span>Desafios</span>
      </button>

      <button class="nav-item" type="button">
        <i data-lucide="x"></i>
        <span>Dropados</span>
      </button>

      <button class="nav-item" type="button">
        <i data-lucide="shopping-cart"></i>
        <span>Aquisições</span>
      </button>

      <button class="nav-item" type="button">
        <i data-lucide="chart-no-axes-column-increasing"></i>
        <span>Hi-Scores</span>
      </button>

    </nav>

  </aside>

  <!-- ===== CONTEÚDO PRINCIPAL ===== -->
  <main class="main-content">

    <section class="page-heading">
      <div class="heading-icon">
        <i data-lucide="clock-3"></i>
      </div>

      <h1>Meu Backlog</h1>
    </section>

    <!-- ===== CABEÇALHO DA LISTA ===== -->
    
<div class="backlog-cabecalho">
  <button type="button"
          class="add-button"
          id="adicionar-backlog"
          hidden>
    <i data-lucide="plus"></i>
    <span>Adicionar jogo</span>
  </button>
</div>


    <!-- ===== TABELA DO BACKLOG ===== -->
    <section class="backlog-lista">

      <table class="backlog-tabela">

        <thead>
          <tr>
            <th>Jogo</th>
            <th>Ano</th>
            <th>Plataforma</th>
            <th>Gênero</th>
            <th>Prioridade</th>
            <th>Observações</th>
            <th>Ações</th>
          </tr>
        </thead>

        <tbody id="backlog-corpo">
          <!-- Jogos serão inseridos pelo JavaScript -->
        </tbody>

      </table>

    </section>

  </main>

</div>


<!-- ===== MODAL DE CADASTRO DO BACKLOG ===== -->

<div id="modal-backlog" class="modal-overlay" aria-hidden="true">

  <div class="modal-conteudo"
       role="dialog"
       aria-modal="true"
       aria-labelledby="modal-backlog-titulo">

    <div class="modal-cabecalho">
      <h2 id="modal-backlog-titulo">Adicionar jogo ao Backlog</h2>

      <button type="button"
              id="fechar-modal-backlog"
              class="fechar-modal"
              aria-label="Fechar">×</button>
    </div>

    <form id="form-backlog" autocomplete="off">

      <div class="campo">
        <label for="backlog-nome">Nome do jogo:</label>
        <input type="text" id="backlog-nome" required>
      </div>

      <div class="form-grid">

        <div class="campo">
          <label for="backlog-ano">Ano:</label>
          <input type="number"
                 id="backlog-ano"
                 min="1970"
                 max="2100"
                 required>
        </div>

        <div class="campo">
          <label for="backlog-plataforma">Plataforma:</label>
          <select id="backlog-plataforma" required>
            <option value="">Selecione</option>
            <option>PC</option>
            <option>SNES</option>
            <option>WII</option>
            <option>NINTENDO 64</option>
            <option>MEGA DRIVE</option>
            <option>MASTER SYSTEM</option>
            <option>ATARI</option>
            <option>PS 1</option>
            <option>PS 2</option>
            <option>NINTENDO DS</option>
            <option>NINTENDO 3DS</option>
            <option>PSP</option>
            <option>GAME BOY</option>
            <option>GAME BOY ADVANCE</option>
            <option>ARCADE</option>
            <option>EMULAÇÃO</option>
            <option>SWITCH</option>
            <option>PS VITA</option>
            <option>NES</option>
            <option>TURBO GRAFX</option>
            <option>GAME BOY COLOR</option>
            <option>GAME GEAR</option>
            <option>GAME CUBE</option>
          </select>
        </div>

        <div class="campo">
          <label for="backlog-genero">Gênero:</label>
          <select id="backlog-genero" required>
            <option value="">Selecione</option>
            <option>AÇÃO/AVENTURA</option>
            <option>BEAT N' UP / H. SLASH</option>
            <option>CORRIDA</option>
            <option>ESTRATÉGIA</option>
            <option>ESPORTE</option>
            <option>FPS</option>
            <option>LUTA</option>
            <option>METROIDVANIA</option>
            <option>MUNDO ABERTO</option>
            <option>PLATAFORMA</option>
            <option>POINT AND CLICK</option>
            <option>PUZZLE</option>
            <option>RPG</option>
            <option>SHOOT 'EM UP</option>
            <option>SURVIVAL HORROR</option>
            <option>WALKING SIMULATOR</option>
          </select>
        </div>

        <div class="campo">
          <label for="backlog-prioridade">Prioridade:</label>
          <select id="backlog-prioridade" required>
            <option value="">Selecione</option>
            <option value="alta">Alta</option>
            <option value="media">Média</option>
            <option value="baixa">Baixa</option>
          </select>
        </div>

      </div>

      <div class="campo">
        <label for="backlog-observacoes">Observações (opcional):</label>
        <textarea id="backlog-observacoes"
                  rows="3"
                  placeholder="Alguma observação sobre o jogo..."></textarea>
      </div>

      <div class="modal-acoes">
        <button type="button"
                id="cancelar-backlog"
                class="btn-cancelar">Cancelar</button>

        <button type="submit"
                class="btn-salvar">Salvar jogo</button>
      </div>

    </form>

  </div>
</div>


<script>
  if (window.lucide) {
    window.lucide.createIcons();
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/backlog.js"></script>

</body>
</html>
