
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Dropados | Frankenstein Gamer</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <div class="app">

    <!-- MENU LATERAL -->
    <aside class="sidebar">

      <div class="brand">
        <i data-lucide="gamepad-2" class="brand-icon"></i>
        <span>MENU</span>
      </div>

      <nav class="navigation">

        <a class="nav-item" href="index.html">
          <i data-lucide="trophy"></i>
          <span>Zerados</span>
        </a>

        <a class="nav-item" href="backlog.html">
          <i data-lucide="clock-3"></i>
          <span>Backlog</span>
        </a>

        <a class="nav-item active" href="dropados.html">
          <i data-lucide="x"></i>
          <span>Dropados</span>
        </a>

        <button class="nav-item" type="button">
          <i data-lucide="target"></i>
          <span>Desafios</span>
        </button>

        <button class="nav-item" type="button">
          <i data-lucide="shopping-cart"></i>
          <span>Aquisições</span>
        </button>

        <button class="nav-item" type="button">
          <i data-lucide="chart-no-axes-column"></i>
          <span>Hi-Scores</span>
        </button>

      </nav>

    </aside>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main-content">

      <div class="page-heading">

        <div class="heading-icon">
          <i data-lucide="x"></i>
        </div>

        <h1>Jogos Dropados</h1>

      </div>

      <!-- BOTÃO DE CADASTRO -->
      <div class="backlog-cabecalho">

        <button
          type="button"
          class="add-button"
          id="adicionar-dropado"
          hidden
        
        >
          <i data-lucide="plus"></i>
          <span>Adicionar jogo</span>
        </button>

      </div>

      <!-- TABELA -->
      <section class="backlog-lista">

        <table class="backlog-tabela">

          <thead>
            <tr>
              <th>Jogo</th>
              <th>Ano</th>
              <th>Plataforma</th>
              <th>Gênero</th>
              <th>Tempo de jogo</th>
              <th>Motivo</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="dropados-corpo">

            <tr>
              <td colspan="7">
                Nenhum jogo dropado cadastrado.
              </td>
            </tr>

          </tbody>

        </table>

      </section>

    </main>

    
<!-- MODAL DE CADASTRO DOS DROPADOS -->
<div id="modal-dropados" class="modal" hidden>

  <div class="modal-content">

    <h2 id="titulo-modal-dropados">
      Adicionar jogo dropado
    </h2>

    <form id="form-dropados">

      <label for="dropado-nome">Nome do jogo</label>
      <input type="text" id="dropado-nome" required>

      <label for="dropado-ano">Ano de lançamento</label>
      <input type="number" id="dropado-ano"
             min="1970" max="2100">

      <label for="dropado-plataforma">Plataforma</label>
      <select id="dropado-plataforma" required>
        <option value="">Selecione</option>
      </select>

      <label for="dropado-genero">Gênero</label>
      <select id="dropado-genero" required>
        <option value="">Selecione</option>
      </select>

      <label>Tempo de jogo</label>

      <div class="tempo-dropados">
        <input type="number" id="dropado-horas"
               min="0" placeholder="Horas">

        <input type="number" id="dropado-minutos"
               min="0" max="59" placeholder="Minutos">
      </div>

      <label for="dropado-motivo">
        Motivo do abandono
      </label>

      <textarea
        id="dropado-motivo"
        rows="5"
        placeholder="Por que você abandonou esse jogo?"
        required
      ></textarea>

      <div class="modal-actions">
        <button type="button" id="cancelar-dropado">
          Cancelar
        </button>

        <button type="submit" id="salvar-dropado">
          Salvar jogo
        </button>

      </div>

    </form>

  </div>

</div>

<!-- MODAL PARA VISUALIZAR O MOTIVO DO ABANDONO -->
<div id="modal-motivo-dropado" hidden>

  <div class="motivo-dropado-conteudo">

    <h2 id="motivo-dropado-titulo"></h2>

    <p id="motivo-dropado-texto"></p>

    <button type="button" id="fechar-motivo-dropado">
      Fechar
    </button>

  </div>

</div>


  </div>

  <script>
    lucide.createIcons();
  </script>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/dropados.js"></script>


</body>
</html>
